<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kriptografi Klasik Web</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        input, textarea, select, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-dekripsi { background: #28a745; }
        .result { margin-top: 15px; background: #e9ecef; padding: 10px; font-family: monospace; font-weight: bold; word-break: break-all; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Kriptografi Klasik</h2>
        <label>Pilih Algoritma:</label>
        <select id="algo">
            <option value="caesar">Caesar Cipher</option>
            <option value="vigenere">Vigenère Cipher</option>
        </select>

        <label>Pesan (Plaintext):</label>
        <textarea id="text" rows="3">abc</textarea>

        <label id="keyLabel">Shift (Kunci Angka):</label>
        <input type="text" id="key" value="1">

        <button onclick="process(true)">Enkripsi</button>
        <button onclick="process(false)" class="btn-dekripsi">Dekripsi Hasil</button>

        <label style="display:block; margin-top:15px;">Hasil Output:</label>
        <div class="result" id="output"></div>
    </div>

    <script>
        document.getElementById('algo').addEventListener('change', function() {
            document.getElementById('keyLabel').innerText = this.value === 'caesar' ? 'Shift (Kunci Angka):' : 'Keyword (Kata Kunci):';
            document.getElementById('key').value = this.value === 'caesar' ? '1' : 'KUNCI';
        });

        function process(isEncrypt) {
            let key = document.getElementById('key').value;
            let algo = document.getElementById('algo').value;
            let inputText = "";

            if (isEncrypt) {
                // Ambil teks dari input textarea
                inputText = document.getElementById('text').value;
            } else {
                // Ambil teks dari kotak hasil (ciphertext)
                inputText = document.getElementById('output').innerText;
                if (!inputText) {
                    alert("Belum ada hasil enkripsi untuk didekripsi!");
                    return;
                }
            }

            let res = "";

            if (algo === 'caesar') {
                let shift = parseInt(key) || 0;
                shift = ((shift % 26) + 26) % 26; 

                res = inputText.replace(/[a-zA-Z]/g, c => {
                    let base = c <= 'Z' ? 65 : 97;
                    let p = c.charCodeAt(0) - base;
                    let newPos = isEncrypt ? (p + shift) % 26 : (p - shift + 26) % 26;
                    return String.fromCharCode(newPos + base);
                });
            } else {
                let kIndex = 0;
                let cleanKey = key.toUpperCase().replace(/[^A-Z]/g, '');
                if (!cleanKey) return alert('Keyword harus berisi huruf!');

                res = inputText.replace(/[a-zA-Z]/g, c => {
                    let base = c <= 'Z' ? 65 : 97;
                    let p = c.charCodeAt(0) - base;
                    let kShift = cleanKey.charCodeAt(kIndex % cleanKey.length) - 65;
                    let newPos = isEncrypt ? (p + kShift) % 26 : (p - kShift + 26) % 26;
                    
                    kIndex++;
                    return String.fromCharCode(newPos + base);
                });
            }

            // Tampilkan hasil ke div output
            document.getElementById('output').innerText = res;
        }
    </script>
</body>
</html>
