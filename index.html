<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kriptografi Klasik Web</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, textarea, select, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .result { margin-top: 15px; background: #e9ecef; padding: 10px; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Kriptografi Klasik</h2>
        <label>Pilih Algoritma:</label>
        <select id="algo">
            <option value="caesar">Caesar Cipher</option>
            <option value="vigenere">Vigenère Cipher</option>
        </select>

        <label>Pesan:</label>
        <textarea id="text">KRIPTOGRAFI</textarea>

        <label id="keyLabel">Shift (Kunci Angka):</label>
        <input type="text" id="key" value="3">

        <button onclick="process(true)">Enkripsi</button>
        <button onclick="process(false)" style="background: #28a745;">Dekripsi</button>

        <div class="result" id="output">Hasil akan muncul di sini...</div>
    </div>

    <script>
        document.getElementById('algo').addEventListener('change', function() {
            document.getElementById('keyLabel').innerText = this.value === 'caesar' ? 'Shift (Kunci Angka):' : 'Keyword (Kata Kunci):';
            document.getElementById('key').value = this.value === 'caesar' ? '3' : 'KUNCI';
        });

        function process(isEncrypt) {
            let text = document.getElementById('text').value;
            let key = document.getElementById('key').value;
            let algo = document.getElementById('algo').value;
            let res = "";

            if (algo === 'caesar') {
                let shift = parseInt(key) || 0;
                if (!isEncrypt) shift = (26 - (shift % 26)) % 26;
                res = text.replace(/[a-zA-Z]/g, c => {
                    let base = c <= 'Z' ? 65 : 97;
                    return String.fromCharCode((c.charCodeAt(0) - base + shift) % 26 + base);
                });
            } else {
                let kIndex = 0;
                key = key.toUpperCase().replace(/[^A-Z]/g, '');
                if (!key) return alert('Keyword harus huruf!');
                res = text.replace(/[a-zA-Z]/g, c => {
                    let base = c <= 'Z' ? 65 : 97;
                    let kShift = key.charCodeAt(kIndex % key.length) - 65;
                    if (!isEncrypt) kShift = (26 - kShift) % 26;
                    kIndex++;
                    return String.fromCharCode((c.charCodeAt(0) - base + kShift) % 26 + base);
                });
            }
            document.getElementById('output').innerText = res;
        }
    </script>
</body>
</html>
